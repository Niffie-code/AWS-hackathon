AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: LexiGemma web app and Bedrock Converse vocabulary coach
Parameters:
  ModelId:
    Type: String
    Default: google.gemma-4-31b
    Description: Confirm the exact model ID supports Converse in the deployment region and account.
Resources:
  WebApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: '$default'
  WebFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .deploy/
      Handler: web_handler.handler
      Runtime: python3.12
      Architectures: [arm64]
      MemorySize: 512
      Timeout: 29
      Environment:
        Variables:
          LEXIGEMMA_MODEL_ID: !Ref ModelId
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource: !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${ModelId}'
      Events:
        Web:
          Type: HttpApi
          Properties:
            ApiId: !Ref WebApi
            Path: /{proxy+}
            Method: ANY
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref WebApi
            Path: /
            Method: GET
Outputs:
  WebUrl:
    Description: Public LexiGemma web application URL
    Value: !Sub 'https://${WebApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/'
